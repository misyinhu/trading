name: Deploy trading bridge

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: winclaw
            runs_on: ["self-hosted", "windows", "winclaw", "trading-bridge"]
            deploy_path: "C:\\projects\\trading"
            py: "C:\\Users\\wang\\AppData\\Local\\Programs\\Python\\Python313\\python.exe"
          - host: cxclaw
            runs_on: ["self-hosted", "windows", "cxclaw", "trading-bridge"]
            deploy_path: "D:\\projects\\trading"
            py: "C:\\Users\\Apple\\AppData\\Local\\Programs\\Python\\Python312\\python.exe"
    runs-on: ${{ matrix.runs_on }}
    env:
      DEPLOY_PATH: ${{ matrix.deploy_path }}
      SERVER_PORT: "5002"
      SERVICE_NAME: trading-bridge
      PY: ${{ matrix.py }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync code to production
        run: |
          $src = "${{ github.workspace }}"
          $dst = "${{ env.DEPLOY_PATH }}"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Write-Host "Syncing -> $dst (host=${{ matrix.host }})"
          $dirs = @("notify","client","config","ctp_client","ctp_md","gm_client","okx_client","account","orders")
          foreach ($d in $dirs) {
            if (Test-Path "$src\$d") {
              & robocopy "$src\$d" "$dst\$d" /MIR /NFL /NDL /NJH /NJS /NP /R:2 /W:3 `
                /XD "__pycache__" ".pytest_cache" /XF "*.pyc"
              if ($LASTEXITCODE -ge 8) { throw "robocopy $d failed ($LASTEXITCODE)" }
              $global:LASTEXITCODE = 0
            }
          }
          Write-Host "Sync done."

      - name: Install python deps
        run: |
          & ${{ env.PY }} -m pip install --quiet --disable-pip-version-check `
            flask requests pyyaml ib_insync schedule psutil
          Write-Host "deps ok"

      - name: Prepare gm_env (掘金 SDK 隔离 venv)
        run: |
          $gmPy = "C:\projects\gm_env\Scripts\python.exe"
          $gmReady = $false
          if (Test-Path $gmPy) {
            try { & $gmPy -c "import gm" 2>&1 | Out-Null; $gmReady = ($LASTEXITCODE -eq 0) }
            catch { $gmReady = $false }
          }
          if (-not $gmReady) {
            & ${{ env.PY }} -m venv C:\projects\gm_env
            & C:\projects\gm_env\Scripts\python.exe -m pip install --quiet --disable-pip-version-check `
              -i https://pypi.tuna.tsinghua.edu.cn/simple "gm==3.0.186" "protobuf==3.20.3"
          }
          Copy-Item "${{ env.DEPLOY_PATH }}\gm_client\gmsim_worker.py" "C:\projects\gm_env\gmsim_worker.py" -Force
          & $gmPy -c "import google.protobuf,sys; print('protobuf', google.protobuf.__version__)"

      - name: Restart service (PM2)
        run: |
          Set-Location "${{ env.DEPLOY_PATH }}"
          # 不用 --update-env：各机代理等环境保持原样，仅重启加载新代码
          cmd /c "pm2 restart ${{ env.SERVICE_NAME }} || (pm2 start ecosystem.config.js && pm2 save)"
          $global:LASTEXITCODE = 0
          Start-Sleep -Seconds 8
          cmd /c "pm2 list"

      - name: Start CTP md workers (Python 3.13, best-effort)
        if: matrix.host == 'cxclaw'
        shell: powershell
        run: |
          $mdPy = $null
          foreach ($cand in @(
            "C:\Users\Apple\AppData\Local\Programs\Python\Python313\python.exe",
            "C:\Users\wang\AppData\Local\Programs\Python\Python313\python.exe")) {
            if (Test-Path $cand) { $mdPy = $cand; break }
          }
          if (-not $mdPy) {
            Write-Host "Python 3.13 not found on runner host; skip ctp md workers"
            exit 0
          }
          Set-Location "${{ env.DEPLOY_PATH }}"
          $pyFwd = $mdPy -replace '\\','/'
          $dstFwd = "${{ env.DEPLOY_PATH }}" -replace '\\','/'
          $eco = @(
            "module.exports = {"
            "  apps: ["
            "    { name: 'ctp-md-simnow', script: '$pyFwd',"
            "      args: 'ctp_md/run_worker.py --profiles simnow --port 5003',"
            "      cwd: '$dstFwd', env: { CTP_PROFILE: 'simnow', PYTHONIOENCODING: 'utf-8' } },"
            "    { name: 'ctp-md-citic', script: '$pyFwd',"
            "      args: 'ctp_md/run_worker.py --profiles citic --port 5004',"
            "      cwd: '$dstFwd', env: { CTP_PROFILE: 'citic', PYTHONIOENCODING: 'utf-8' } }"
            "  ]"
            "};"
          )
          ($eco -join "`n") | Set-Content -Encoding UTF8 ecosystem.md.config.js
          cmd /c "pm2 startOrReload ecosystem.md.config.js --update-env && pm2 save"
          Start-Sleep -Seconds 5
          foreach ($p in 5003,5004) {
            try {
              (Invoke-WebRequest "http://127.0.0.1:$p/health" -UseBasicParsing -TimeoutSec 5).Content
            } catch {
              Write-Host "ctp md :$p health not ready yet (non-fatal; check pm2 logs)"
            }
          }

      - name: Health check
        run: |
          $url = "http://127.0.0.1:${{ env.SERVER_PORT }}/health"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                Write-Host "Service healthy after $(( $i + 1 ) * 2) seconds"
                $ok = $true; break
              }
            } catch { Write-Host "  Attempt $(( $i + 1 )): $($_.Exception.Message)" }
          }
          if (-not $ok) { cmd /c "pm2 logs ${{ env.SERVICE_NAME }} --lines 40 --nostream"; exit 1 }

      - name: Smoke test
        run: |
          $tests = @(
            @{ url = "http://127.0.0.1:5002/api/gm/history?symbol=SHSE.600000&frequency=1d&start_time=2026-08-01&end_time=2026-09-09"; name = "gm history" },
            @{ url = "http://127.0.0.1:5002/health/full"; name = "health full" }
          )
          foreach ($t in $tests) {
            try {
              $r = Invoke-WebRequest -Uri $t.url -UseBasicParsing -TimeoutSec 60
              Write-Host ("[{0}] {1}: {2}" -f $(if ($r.StatusCode -eq 200) {"PASS"} else {"FAIL"}), $t.name, $r.Content.Substring(0, [Math]::Min(200, $r.Content.Length)))
            } catch {
              Write-Host "[FAIL] $($t.name): $($_.Exception.Message)"
            }
          }
