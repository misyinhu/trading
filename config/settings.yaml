okx:
  flag: sim
  pairs:
  - min_size: 1
    symbol: DOGE-USDT
  - min_size: 10
    symbol: ETH-USDT
  - min_size: 10
    symbol: BTC-USDT
simnow:
  flag: sim   # sim=SimNow模拟, live=SimNow生产（接真实CTP）
  # CTP 原生(SWIG .pyd)在当前账号登录时会触发进程级崩溃，会带走 Flask 主服务。
  # 默认关闭 CTP 入口；待子进程隔离/有效 SimNow 账号就绪后改 true 或设 SIMNOW_ENABLED=1。
  enabled: true
  # SimNow 第一套环境地址（官网公告）
  #   交易: 182.254.243.31:30001  行情: 182.254.243.31:30011
  # 第一套标准环境（交易时段可用）。7x24 环境 40001/40011 当前不可达（2026-09 实测 TCP fail）。
  md_server: "tcp://182.254.243.31:30011"
  td_server: "tcp://182.254.243.31:30001"
  broker_id: "9999"
  app_id: "simnow_client_test"     # 官方默认 APPID
  auth_code: "0000000000000000"     # 官方默认认证码（16位零）
  # 账户信息从 secrets.toml 读取：
  #   SIMNOW_SIM_USER / SIMNOW_SIM_PASSWORD

# 中信期货 CTP 仿真（独立券商通道，与 simnow 平级；profile=citic）
# 与 SimNow 完全独立：?profile=citic 路由。账号/密码/认证码/AppID/前置地址
# 优先从 secrets.toml / 环境变量读取（CITIC_CTP_*），这里只放非敏感默认与说明。
citic:
  label: "中信期货仿真"
  enabled: true
  # ↓↓↓ 以下三项需从中信「仿真/看穿式接入」资料填写（secrets 或此处均可，建议 secrets）↓↓↓
  td_server: ""        # 交易前置，如 tcp://1.2.3.4:xxxx（中信提供）
  md_server: ""        # 行情前置（worker 当前只用交易前置，可留空）
  broker_id: ""        # 经纪商代码（中信提供）
  app_id: ""           # 看穿式 AppID（中信下发；与 auth_code 配套）
  # 认证码 auth_code、账号 user、密码 password 走 secrets：
  #   CITIC_CTP_USER / CITIC_CTP_PASSWORD / CITIC_CTP_AUTH_CODE
  #   CITIC_CTP_APP_ID / CITIC_CTP_BROKER_ID / CITIC_CTP_TD_SERVER / CITIC_CTP_MD_SERVER
quant_core:
  client_id: '10'
  timeout: 30
  url: http://100.99.204.126:8005
query_only: false
risk_gate:
  max_daily_loss_pct: 0.05
  max_leverage: 3.0
  max_open_positions: 3
  min_correlation: 0.7
  zscore_critical: 4.0
