# CTP profile 名册：simnow/citic 经模拟桥 5002；live 经实盘网关 5006（5002 已拒绝 live）。
# live 为真实资金账户：仅人工报/撤单，每笔过 ctp_live 实盘风控门 + 飞书通知；
# agent 不得对 live 自动下单（红线，见 tools/trading_adapter.py）。
