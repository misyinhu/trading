  simnow:
    label: 上期官方仿真
    investor: "274467"
    mode: sim
  citic:
    label: 中信期货仿真
    investor: "7108804861"
    mode: sim
  live:
    label: 正式版CTP（中信实盘·只读/仅人工）
    investor: "821350082"
    mode: live
    auto_trade: false
ctp_md:
  # 常驻行情 worker（独立进程；MdApi tick 内存快照，微秒级，无流控）。
  # host 默认跟随上方 trading.url（worker 与报单桥同机部署，换桥即跟着切）；
  # 临时指到别的机器时显式填 host（或环境变量 CTP_MD_HOST）。
  # SWIG 版本不同，simnow/citic 必须分 profile 分进程（5003/5004）。
  host: ""
  simnow_port: 5003
  citic_port: 5004
data_health:
  endpoint: http://127.0.0.1:5003/api/data/health
  port_note: 5001 被 coze-intake-webhook 占用，quant-agent spine proxy 跑 5003
  active_server: winclaw
  probes:
  - ib
  - ctp_citic
  - ctp_simnow
  - ctp_live   # 只读探活，绝不下单
  - gm
  - okx
  description: data_agent 数据源健康探测（跨服务器聚合）
