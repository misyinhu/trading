openapi: 3.0.3
info:
  title: Trading Webhook Bridge API
  description: |
    TradingView Webhook -> 飞书 中转服务
    支持Webhook URL、飞书消息控制、命令执行、自然语言下单
  version: 1.3.0
  contact:
    name: Trading Project
servers:
  - url: https://trading-server
    description: Production server
  - url: http://localhost:{port}
    description: Local development server
    variables:
      port:
        default: "5000"
        description: Flask server port

paths:
  /tv-webhook:
    post:
      summary: TradingView Webhook 接收端点
      description: |
        接收 TradingView 的 webhook 请求，执行交易指令。
        支持单个标的和配对交易模式。
      tags:
        - Webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TVWebhookRequest'
            examples:
              single_order:
                summary: 单个标的交易
                value:
                  symbol: "GC"
                  action: "BUY"
                  quantity: 1
                  exchange: "NYMEX"
                  sec_type: "FUT"
              pair_trade:
                summary: 配对交易
                value:
                  symbols: ["GC", "SI"]
                  actions: ["BUY", "SELL"]
                  exchange: "OKX"
      responses:
        '200':
          description: 交易指令已接收并处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /feishu-webhook:
    get:
      summary: 飞书 Webhook 验证（URL Verification）
      description: 用于飞书开放平台的 URL 验证
      tags:
        - Webhook
      parameters:
        - name: challenge
          in: query
          required: false
          schema:
            type: string
          description: 飞书验证挑战码
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
    post:
      summary: 飞书消息 Webhook 接收端点
      description: |
        接收飞书消息事件，支持 Schema 1.0 和 Schema 2.0 格式。
        自动归一化为内部格式后处理。
      tags:
        - Webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeishuWebhookRequest'
            examples:
              schema2_message:
                summary: Schema 2.0 消息格式
                value:
                  header:
                    event_type: "im.message.receive_v1"
                  event:
                    message:
                      content: '{"text":"买入1手GC"}'
                      message_id: "om_xxx"
                      chat_id: "oc_xxx"
              simple_test:
                summary: 简化测试格式
                value:
                  message:
                    content: "买入1手GC"
                    chat_id: "oc_default"
      responses:
        '200':
          description: 消息已处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeishuResponse'
        '400':
          description: 请求格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /test-api:
    post:
      summary: 测试 API 端点
      description: 发送测试消息到飞书，验证连接性
      tags:
        - Debug
      responses:
        '200':
          description: 测试成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestApiResponse'

  /positions:
    get:
      summary: 获取当前持仓
      description: 返回所有当前持仓信息（来自 IB）
      tags:
        - Trading
      responses:
        '200':
          description: 持仓列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionsResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders:
    get:
      summary: 获取当前挂单
      description: 返回所有未完成的挂单（来自 IB）
      tags:
        - Trading
      responses:
        '200':
          description: 挂单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: 健康检查端点
      description: 返回服务健康状态和配置信息
      tags:
        - Debug
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /test-mtf:
    post:
      summary: 多时间周期测试端点
      description: 触发多时间周期分析测试
      tags:
        - Debug
      responses:
        '200':
          description: 测试完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: 测试结果


  /api/ctp/account:
    get:
      summary: CTP/SimNow 账户资金
      description: |
        查询仿真期货账户权益/可用/保证金/冻结。走独立子进程 worker（原生崩溃不影响主服务）。
        `?force=1` 跳过 20s 缓存强制重登重查。
      tags: [CTP]
      parameters:
        - name: force
          in: query
          required: false
          schema: {type: string, enum: ["1", "0"]}
      responses:
        '200':
          description: 账户信息
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CtpAccountResponse'}
        '503':
          description: CTP 不可用（超时/原生子进程崩溃/休市）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/ctp/positions:
    get:
      summary: CTP/SimNow 当前持仓
      tags: [CTP]
      parameters:
        - name: force
          in: query
          required: false
          schema: {type: string, enum: ["1", "0"]}
      responses:
        '200':
          description: 持仓列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: logined}
                  count: {type: integer}
                  positions:
                    type: array
                    items: {$ref: '#/components/schemas/CtpPosition'}

  /api/ctp/order:
    post:
      summary: CTP/SimNow 报单（限价）
      description: |
        登录→结算确认后 ReqOrderInsert。返回柜台回报；挂单成功 status=accepted。
        方向/开平/价格/手数见请求字段；价格须为 tick 整数倍且在涨跌停内。
      tags: [CTP]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CtpOrderRequest'}
            example:
              instrument_id: IC2609
              exchange_id: CFFEX
              direction: "0"
              offset_flag: "0"
              price: 7800.0
              volume: 1
      responses:
        '200':
          description: 报单结果（action_result 含 status/order_ref/order_sys_id 等）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CtpActionResponse'}
        '400':
          description: 参数错误或柜台拒单（价格越界/休市等）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CtpActionResponse'}
        '503':
          description: CTP 子进程超时/崩溃/未启用

  /api/ctp/cancel:
    post:
      summary: CTP/SimNow 撤单
      description: |
        撤挂单。推荐 order_ref+front_id+session_id（跨连接可靠）；仅传 order_ref 时
        worker 会先 ReqQryOrder 查当日委托自动补全三要素。order_sys_id 为备选（SimNow
        跨连接偶发 [25] 找不到报单）。
      tags: [CTP]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CtpCancelRequest'}
            example:
              instrument_id: IC2609
              exchange_id: CFFEX
              order_ref: "44530938"
      responses:
        '200':
          description: 撤单结果（action_result.status=canceled）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CtpActionResponse'}
        '400':
          description: 参数错误或撤单被拒
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CtpActionResponse'}

  /api/ctp/instruments:
    get:
      summary: 查询品种全部可交易合约月份
      tags: [CTP]
      parameters:
        - {name: product, in: query, required: true, schema: {type: string}, description: "品种字母代码，如 IC/IF/AU"}
        - {name: exchange, in: query, required: false, schema: {type: string}, description: "交易所，如 CFFEX/SHFE"}
      responses:
        '200':
          description: 合约月份列表（乘数/tick/到期日/是否可交易）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CtpInstrumentsResponse'}

  /api/ctp/main-contract:
    get:
      summary: 按持仓量(OI)判定主力合约
      description: |
        查可交易月份后逐合约查行情，取 OpenInterest 最大者为主力；带回最新价与涨跌停。
        行情缺失回退近月（main_by=nearest_expiry_fallback）。用于把主力连续
        （如 KQ.m@CFFEX.IC）解析成可下单的具体月份（IC2609）。
      tags: [CTP]
      parameters:
        - {name: product, in: query, required: true, schema: {type: string}}
        - {name: exchange, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: 主力合约 + 各月行情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CtpMainContractResponse'}


  /api/gm/account:
    get:
      summary: 掘金量化(gm) A股模拟账户资金
      description: |
        经本地掘金终端(localhost:7001)查询模拟账户。走独立 venv(gm_env) 子进程
        run(mode=1) 框架；gm SDK 依赖 protobuf<4，与系统隔离。?force=1 跳过 20s 缓存。
      tags: [GM]
      parameters:
        - {name: force, in: query, required: false, schema: {type: string, enum: ["1", "0"]}}
      responses:
        '200':
          description: 账户资金
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GmAccountResponse'}
        '503':
          description: 终端/服务不可达或未配置 GM_TOKEN
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/gm/positions:
    get:
      summary: 掘金量化(gm) 模拟持仓
      tags: [GM]
      parameters:
        - {name: force, in: query, required: false, schema: {type: string, enum: ["1", "0"]}}
      responses:
        '200':
          description: 持仓列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel: {type: string, example: gm}
                  count: {type: integer}
                  positions:
                    type: array
                    items: {$ref: '#/components/schemas/GmPosition'}

  /api/gm/order:
    post:
      summary: 掘金量化(gm) 模拟下单（A股个股/期货）
      description: |
        平台内模拟撮合。side: 1买/2卖；order_type: 1限价/2市价；
        position_effect: 1开/2平。A股股票数量≥100股。
      tags: [GM]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GmOrderRequest'}
            example:
              symbol: SHSE.600000
              side: 1
              volume: 100
              order_type: 1
              position_effect: 1
              price: 10.5
      responses:
        '200':
          description: 下单结果（action_result 含 cl_ord_id/status/filled_volume）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GmActionResponse'}
        '400':
          description: 参数错误或被拒（ord_rej_reason_detail）
        '503':
          description: gm 子进程超时/崩溃/未配置

  /api/gm/cancel:
    post:
      summary: 掘金量化(gm) 撤未成交委托
      description: 按 symbol 撤该账户未成交委托；省略 symbol 撤全部。
      tags: [GM]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                symbol: {type: string, example: SHSE.600000}
      responses:
        '200':
          description: 撤单结果（status=cancel_submitted / nothing_to_cancel）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GmActionResponse'}

  /api/gm/history:
    get:
      summary: 掘金量化(gm) K 线历史（只读，走本地掘金终端）
      description: |
        经 gm_env 子进程 run(mode=1) 调 gm.api.history。frequency 为 1m/5m/15m/30m/1h/1d
        （内部转 `3600s`/`1d` 字符串）。期货 symbol 必须带交易所前缀且用【具体月份合约】：
        SC/LU 在 INE（如 INE.sc2610、INE.lu2610），FU/AU/CU 在 SHFE（如 SHFE.fu2609），
        股指在 CFFEX（如 CFFEX.IC2609），A 股 SHSE/SZSE。连续合约 `xxx88` 的 history 返空。
      tags: [GM]
      parameters:
        - {name: symbol, in: query, required: true, schema: {type: string}, description: "gm 合约代码，如 INE.sc2610 / SHSE.600000"}
        - {name: frequency, in: query, required: false, schema: {type: string, default: "1h"}, description: "1m/5m/15m/30m/1h/1d"}
        - {name: start_time, in: query, required: false, schema: {type: string}, description: "YYYY-MM-DD"}
        - {name: end_time, in: query, required: false, schema: {type: string}, description: "YYYY-MM-DD"}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  status: {type: string}
                  symbol: {type: string}
                  frequency: {type: string}
                  interval_min: {type: number}
                  count: {type: integer}
                  bars:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp: {type: string, description: "ISO8601（eob，北京时间）"}
                        open: {type: number}
                        high: {type: number}
                        low: {type: number}
                        close: {type: number}
                        volume: {type: number}
                        amount: {type: number}
        '503':
          description: gm 子进程超时/崩溃/未配置

components:
  schemas:
    TVWebhookRequest:
      type: object
      required:
        - symbol
        - action
      properties:
        symbol:
          type: string
          description: 交易标的代码 (如 "GC", "FU")
          example: "GC"
        action:
          type: string
          enum: [BUY, SELL, CLOSE]
          description: 交易动作
          example: "BUY"
        quantity:
          type: number
          description: 交易数量
          default: 1
          example: 1
        exchange:
          type: string
          description: 交易所代码 (如 "NYMEX", "OKX", "CME")
          example: "NYMEX"
        sec_type:
          type: string
          description: 证券类型
          default: "FUT"
          example: "FUT"
        usd_amount:
          type: number
          description: USD 金额（用于市价单）
          example: 1000
        leverage:
          type: number
          description: 杠杆倍数
          example: 10
        margin_mode:
          type: string
          enum: [cross, isolated]
          description: 保证金模式
        order_type:
          type: string
          description: 订单类型
          default: "market"
          example: "market"
        symbols:
          type: array
          items:
            type: string
          description: 配对交易标的列表
          example: ["GC", "SI"]
        actions:
          type: array
          items:
            type: string
            enum: [BUY, SELL, CLOSE]
          description: 配对交易动作列表
          example: ["BUY", "SELL"]

    FeishuWebhookRequest:
      type: object
      description: |
        支持两种格式：
        1. Schema 2.0 (标准飞书事件格式)
        2. 简化测试格式 {"message": {"content": "..."}}
      oneOf:
        - $ref: '#/components/schemas/FeishuSchema2Event'
        - $ref: '#/components/schemas/FeishuSimpleMessage'

    FeishuSchema2Event:
      type: object
      properties:
        header:
          type: object
          properties:
            event_type:
              type: string
              example: "im.message.receive_v1"
        event:
          type: object
          properties:
            message:
              type: object
              properties:
                content:
                  type: string
                  description: JSON 字符串，包含消息内容
                message_id:
                  type: string
                chat_id:
                  type: string

    FeishuSimpleMessage:
      type: object
      properties:
        message:
          type: object
          properties:
            content:
              type: string
              description: 消息内容，可以是纯文本或 JSON
              example: "买入1手GC"
            chat_id:
              type: string

    FeishuResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: string
        message:
          type: string

    WebhookResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
          example: "success"
        message:
          type: string
        order_id:
          type: string
          description: 订单ID（如果已下单）
        results:
          type: array
          description: 配对交易结果
          items:
            type: object

    PositionsResponse:
      type: object
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        count:
          type: integer
          description: 持仓数量

    Position:
      type: object
      properties:
        symbol:
          type: string
          example: "GC"
        position:
          type: number
          example: 5
        avgCost:
          type: number
          example: 1950.5
        account:
          type: string
          example: "DU123456"
        contract:
          type: string
          example: "GC Jun25"

    OrdersResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        count:
          type: integer
          description: 挂单数量

    Order:
      type: object
      properties:
        orderId:
          type: integer
          example: 123456
        symbol:
          type: string
          example: "GC"
        action:
          type: string
          example: "BUY"
        quantity:
          type: number
          example: 1
        status:
          type: string
          example: "Submitted"
        filled:
          type: number
          example: 0

    TestApiResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        config:
          type: object
          properties:
            app_id:
              type: boolean
              description: 是否已配置飞书 App ID
            conversation_id:
              type: boolean
              description: 是否已配置会话 ID
            query_only:
              type: boolean
              description: 是否为仅查询模式

    CtpPosition:
      type: object
      properties:
        symbol: {type: string, example: IC2609}
        direction: {type: string}
        volume: {type: integer}
        avg_price: {type: number}
        float_pnl: {type: number}

    CtpAccountResponse:
      type: object
      properties:
        status: {type: string, example: logined}
        investor: {type: string, example: "274467"}
        trading_day: {type: string, example: "20260901"}
        account:
          type: object
          properties:
            account_id: {type: string}
            balance: {type: number}
            available: {type: number}
            margin: {type: number}
            frozen_margin: {type: number}
            position_pnl: {type: number}
            close_pnl: {type: number}
            commission: {type: number}
            currency: {type: string, example: CNY}

    CtpOrderRequest:
      type: object
      required: [instrument_id, direction, offset_flag, volume]
      properties:
        instrument_id: {type: string, example: IC2609}
        exchange_id: {type: string, example: CFFEX}
        direction: {type: string, description: "0 买 / 1 卖", example: "0"}
        offset_flag: {type: string, description: "0 开 / 1 平 / 3 平今 / 4 平昨", example: "0"}
        price: {type: number, description: 限价（price_type=2 时必填>0）}
        volume: {type: integer, example: 1}
        price_type: {type: string, description: "2 限价(默认) / 1 市价", example: "2"}
        hedge_flag: {type: string, description: "1 投机(默认)", example: "1"}

    CtpCancelRequest:
      type: object
      required: [instrument_id]
      properties:
        instrument_id: {type: string, example: IC2609}
        exchange_id: {type: string, example: CFFEX}
        order_ref: {type: string, description: 报单返回的 OrderRef}
        front_id: {type: integer, description: 前置编号}
        session_id: {type: integer, description: 会话编号}
        order_sys_id: {type: string, description: 交易所系统号（备选）}

    CtpActionResponse:
      type: object
      properties:
        ok: {type: boolean}
        action: {type: string, enum: [order, cancel]}
        status: {type: string, enum: [accepted, partial, filled, canceled, rejected, no_report]}
        trading_day: {type: string}
        front_id: {type: integer}
        session_id: {type: integer}
        action_result:
          type: object
          properties:
            ok: {type: boolean}
            status: {type: string}
            order_ref: {type: string}
            order_sys_id: {type: string}
            order_status: {type: string}
            volume_traded: {type: integer}
            error: {type: string, description: 柜台错误原文（被拒时）}
        order_events:
          type: array
          items: {type: object}
        trade_events:
          type: array
          items: {type: object}

    CtpInstrument:
      type: object
      properties:
        instrument_id: {type: string, example: IC2609}
        exchange_id: {type: string}
        product_id: {type: string}
        name: {type: string}
        volume_multiple: {type: integer, example: 200}
        price_tick: {type: number, example: 0.2}
        expire_date: {type: string, example: "20260918"}
        is_trading: {type: integer, example: 1}
        open_interest: {type: integer, description: 持仓量（main-contract 接口）}
        volume: {type: integer}
        last_price: {type: number}
        upper_limit: {type: number}
        lower_limit: {type: number}

    CtpInstrumentsResponse:
      type: object
      properties:
        ok: {type: boolean}
        status: {type: string}
        instruments:
          type: array
          items: {$ref: '#/components/schemas/CtpInstrument'}
        tradable_count: {type: integer}

    CtpMainContractResponse:
      type: object
      properties:
        ok: {type: boolean}
        product: {type: string, example: IC}
        exchange: {type: string}
        main_by: {type: string, enum: [open_interest, nearest_expiry_fallback]}
        main_contract: {$ref: '#/components/schemas/CtpInstrument'}
        front_contract: {$ref: '#/components/schemas/CtpInstrument'}
        tradable_count: {type: integer}
        instruments:
          type: array
          items: {$ref: '#/components/schemas/CtpInstrument'}

    GmPosition:
      type: object
      properties:
        symbol: {type: string, example: SHSE.600000}
        direction: {type: string, example: long}
        volume: {type: integer}
        avg_price: {type: number}
        float_pnl: {type: number}
        market_value: {type: number}
        channel: {type: string, example: gm}

    GmAccountResponse:
      type: object
      properties:
        status: {type: string, example: logined}
        channel: {type: string, example: gm}
        account:
          type: object
          properties:
            account_id: {type: string}
            balance: {type: number, description: 净值(总权益)}
            available: {type: number}
            market_value: {type: number}
            frozen: {type: number}
            pnl: {type: number}
            fpnl: {type: number}
            currency: {type: string, example: CNY}

    GmOrderRequest:
      type: object
      required: [symbol, side, volume]
      properties:
        symbol: {type: string, example: SHSE.600000, description: "交易所代码，A股 SHSE./SZSE.，期货 CFFEX./SHFE. 等"}
        side: {type: integer, description: "1 买 / 2 卖", example: 1}
        volume: {type: integer, description: "数量（A股≥100股；期货为手数）", example: 100}
        order_type: {type: integer, description: "1 限价(默认) / 2 市价", example: 1}
        position_effect: {type: integer, description: "1 开仓(默认) / 2 平仓", example: 1}
        price: {type: number, description: 限价（order_type=1 时必填）}

    GmActionResponse:
      type: object
      properties:
        ok: {type: boolean}
        status: {type: string, description: "submitted/rejected/cancel_submitted/nothing_to_cancel/crashed/timeout"}
        channel: {type: string, example: gm}
        action_result:
          type: object
          properties:
            cl_ord_id: {type: string}
            symbol: {type: string}
            side: {type: integer}
            price: {type: number}
            volume: {type: integer}
            filled_volume: {type: integer}
            status: {type: integer}
            ord_rej_reason_detail: {type: string}
        cancelled: {type: integer}
        count: {type: integer}
        positions:
          type: array
          items: {$ref: '#/components/schemas/GmPosition'}

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: 错误信息
          example: "Invalid symbol"
      required:
        - error

tags:
  - name: GM
    description: 掘金量化 A 股模拟交易（独立 venv 子进程，本地掘金终端）
  - name: CTP
    description: CTP/SimNow 期货仿真交易（子进程隔离 worker）
  - name: Webhook
    description: Webhook 接收端点
  - name: Trading
    description: 交易相关操作
  - name: Debug
    description: 调试和测试端点
